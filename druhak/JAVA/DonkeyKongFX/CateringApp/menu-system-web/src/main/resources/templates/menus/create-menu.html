<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Menu</title>
</head>
<body>
<h1>Create Menu</h1>
<form th:action="@{/ui/menus/create}" th:object="${request}" method="post">
    <label>Name: <input type="text" th:field="*{name}"/></label><br/>
    <label>Project:
        <select th:field="*{projectId}">
            <option th:each="project : ${projects}" th:value="${project.projectId}" th:text="${project.name}"></option>
        </select>
    </label><br/>
    <label>Created By:
        <select th:field="*{createdBy}">
            <option th:each="user : ${users}" th:value="${user.userId}" th:text="${user.name}"></option>
        </select>
    </label><br/>
    <label>Template:
        <select th:field="*{templateId}">
            <option value="">(none)</option>
            <option th:each="template : ${templates}" th:value="${template.templateId}" th:text="${template.name}"></option>
        </select>
    </label><br/>
    <label>With Prices: <input type="checkbox" th:field="*{withPrices}"/></label><br/>
    <button type="submit">Create</button>
</form>
<p><a th:href="@{/ui/items/create}">Create Item</a></p>
</body>
</html>
