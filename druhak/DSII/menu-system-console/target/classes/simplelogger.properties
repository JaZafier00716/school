# SLF4J Simple Logger configuration
# Set logging level: TRACE, DEBUG, INFO, WARN, ERROR
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Configure specific loggers
org.slf4j.simpleLogger.log.com.example.cateringapp.db.DatabaseConfig=DEBUG
org.slf4j.simpleLogger.log.com.example.cateringapp.dao.MenuVersionDao=DEBUG
org.slf4j.simpleLogger.log.com.example.cateringapp.MainApp=INFO

# Show date/time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show short name instead of full qualified name
org.slf4j.simpleLogger.showShortLogName=false

