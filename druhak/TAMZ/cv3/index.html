<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <title>Ukázka PWA TAMZ 1</title>
	<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
	<script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" rel="stylesheet"> 
	
	<!-- PWA Manifest and extra icon for iOS -->
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" sizes="256x256" href="tamz1-256x256.png">
</head>
<body>

<ion-header>
	<ion-toolbar>
	  <ion-title>Greeter Example</ion-title>
	</ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
	<h1>Enter your name</h1>
	<ion-input placeholder="e.g. John Doe" id="name"></ion-input><br>
	<ion-button id="greet-alert" onclick="displayGreeting()">Greet me!</ion-button>
</ion-content>

<!-- Tlačítko a výstraha nejsou propojeny, o zobrazení se stará JS -->
<ion-alert id="greeter"	header="Greetings"></ion-alert>
<script>
    function displayGreeting() {
        var name = document.getElementById('name').value;
        console.log("Name: \"" + name + "\"");
        if (name === "" || name === undefined) {
            window.alert('You did not fill in the name!')
        } else {
			const alrt = document.getElementById("greeter");
			alrt.message = "Hello " + name + "!";
			alrt.buttons = ['Dismiss'];
			alrt.present();
        }
    }
</script>
<script src="install.js"></script> <!-- PWA installation script file -->
</body>
</html>
