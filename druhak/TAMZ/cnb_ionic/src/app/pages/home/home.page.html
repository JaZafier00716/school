<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Currency Converter</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="page-shell home-shell">
    <ion-card class="hero-card">
      <ion-card-header>
        <ion-card-title class="hero-title">CZK exchange rates</ion-card-title>
        <ion-card-subtitle>Convert Czech koruna into live or historical foreign currencies.</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-item lines="none" class="amount-item">
          <ion-label position="stacked">Amount in CZK</ion-label>
          <ion-input
            type="number"
            inputmode="decimal"
            min="0"
            [value]="amountCZK"
            (ionInput)="onAmountChange($event)"
            placeholder="1000"
          ></ion-input>
        </ion-item>

        <div class="hero-meta">
          <ion-chip color="primary" *ngIf="customDateEnabled; else liveModeChip">Historical date: {{ selectedDate }}</ion-chip>
          <ng-template #liveModeChip>
            <ion-chip color="secondary">Live SSE mode</ion-chip>
          </ng-template>
          <ion-chip outline="true" *ngIf="apiResponse">Data date: {{ apiResponse.date }}</ion-chip>
        </div>
      </ion-card-content>
    </ion-card>

    <app-error-banner *ngIf="error" [message]="error" (retry)="refreshRates()"></app-error-banner>
    <app-loading-state
      *ngIf="loading"
      message="Loading exchange rates..."
      subMessage="Live rates are streamed with SSE when custom date is disabled."
    ></app-loading-state>

    <app-language-selector
      [language]="selectedLanguage"
      [disabled]="loading"
      (languageChange)="onLanguageChange($event)"
    ></app-language-selector>

    <app-date-selector
      [customDateEnabled]="customDateEnabled"
      [selectedDate]="selectedDate"
      [minDate]="minDate"
      [maxDate]="maxDate"
      (customDateEnabledChange)="onCustomDateEnabledChange($event)"
      (selectedDateChange)="onDateChange($event)"
    ></app-date-selector>

    <app-currency-selector
      [currencies]="currencies"
      [selectedCurrency]="selectedCurrency"
      [selectedCurrencyCode]="selectedCurrencyCode"
      [loading]="loading"
      (currencyChange)="onCurrencySelected($event)"
    ></app-currency-selector>

    <app-conversion-result
      [selectedCurrency]="selectedCurrency"
      [apiResponse]="apiResponse"
      [amountCZK]="amountCZK"
      [convertedAmount]="convertedAmount"
    ></app-conversion-result>

    <app-currency-grid
      [currencies]="currencies"
      [selectedCurrencyCode]="selectedCurrencyCode"
      (currencySelected)="onCurrencySelected($event)"
    ></app-currency-grid>
  </div>
</ion-content>
