<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ copy.appTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="page-shell home-shell">
    <ion-card class="hero-card">
      <ion-card-header>
        <ion-card-title class="hero-title">{{ copy.heroTitle }}</ion-card-title>
        <ion-card-subtitle>{{ copy.heroSubtitle }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-item lines="none" class="amount-item">
          <ion-label position="stacked">{{ copy.amountLabel }}</ion-label>
          <ion-input
            type="number"
            inputmode="decimal"
            min="0"
            [value]="amountCZK"
            (ionInput)="onAmountChange($event)"
            placeholder="1000"
          ></ion-input>
        </ion-item>

        <div class="hero-meta">
          <ion-chip color="primary" *ngIf="customDateEnabled; else liveModeChip">{{ copy.historicalDateChip }} {{ selectedDate }}</ion-chip>
          <ng-template #liveModeChip>
            <ion-chip color="secondary">{{ copy.liveModeChip }}</ion-chip>
            <ion-chip outline="true">{{ copy.todayChip }} {{ todayDate }}</ion-chip>
          </ng-template>
        </div>
      </ion-card-content>
    </ion-card>

    <app-error-banner
      *ngIf="error"
      [title]="copy.errorTitle"
      [message]="copy.errorMessage"
      [retryLabel]="copy.errorRetry"
      (retry)="refreshRates()"
    ></app-error-banner>
    <app-loading-state
      *ngIf="loading"
      [message]="copy.loadingMessage"
      [subMessage]="copy.loadingSubMessage"
    ></app-loading-state>

    <app-language-selector
      [language]="selectedLanguage"
      [disabled]="loading"
      [labels]="copy.language"
      (languageChange)="onLanguageChange($event)"
    ></app-language-selector>

    <app-date-selector
      [customDateEnabled]="customDateEnabled"
      [selectedDate]="selectedDate"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [labels]="copy.date"
      (customDateEnabledChange)="onCustomDateEnabledChange($event)"
      (selectedDateChange)="onDateChange($event)"
    ></app-date-selector>

    <app-currency-selector
      [currencies]="currencies"
      [selectedCurrency]="selectedCurrency"
      [selectedCurrencyCode]="selectedCurrencyCode"
      [loading]="loading"
      [labels]="copy.currencySelector"
      (currencyChange)="onCurrencySelected($event)"
    ></app-currency-selector>

    <app-conversion-result
      [selectedCurrency]="selectedCurrency"
      [apiResponse]="apiResponse"
      [amountCZK]="amountCZK"
      [convertedAmount]="convertedAmount"
      [labels]="copy.conversionResult"
    ></app-conversion-result>

    <app-currency-grid
      [currencies]="currencies"
      [selectedCurrencyCode]="selectedCurrencyCode"
      [labels]="copy.currencyGrid"
      (currencySelected)="onCurrencySelected($event)"
    ></app-currency-grid>
  </div>
</ion-content>
